<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>electron-kit Demo</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../node_modules/material-icons/iconfont/round.css">
    <link rel="stylesheet" href="../node_modules/@diamonddigitaldev/electron-kit/css/kit.css">
    <link rel="stylesheet" href="styles/accent.css">
    <link rel="stylesheet" href="styles.css">
    <script src="../node_modules/@diamonddigitaldev/electron-kit/page/theme.js"></script>
</head>
<body>
    <!-- The app's own parts. kit.ui.mountShell() (renderer.js) builds the rail,
         the header and the Settings view around them, and moves them in. -->
    <div id="toolbar" class="d-flex gap-2 align-items-center">
        <button id="open-isolated" type="button" class="btn btn-sm btn-secondary d-inline-flex align-items-center gap-1">
            <span class="material-icons-round" style="font-size: 16px" aria-hidden="true">open_in_new</span>Open Isolated Window
        </button>
    </div>

    <div id="overview-view" class="demo-view">
        <table class="table table-sm align-middle">
            <tbody>
                <tr>
                    <th scope="row">Shared Bridge (kitAPI)</th>
                    <td id="kit-api">Checking…</td>
                </tr>
                <tr>
                    <th scope="row">App Bridge (electronAPI)</th>
                    <td id="electron-api">Checking…</td>
                </tr>
                <tr>
                    <th scope="row">Sandboxed</th>
                    <td id="sandboxed">Checking…</td>
                </tr>
                <tr>
                    <th scope="row">Page Library (kit.js)</th>
                    <td id="kit-js">Checking…</td>
                </tr>
                <tr>
                    <th scope="row">Kit Styles (kit.css)</th>
                    <td id="kit-css">Checking…</td>
                </tr>
                <tr>
                    <th scope="row">Theme (theme.js)</th>
                    <td id="theme">Checking…</td>
                </tr>
            </tbody>
        </table>

        <div id="accent-sample">
            <h2 id="accent" class="h6 mt-4 mb-2">Accent</h2>
            <p class="mb-2">
                <span class="pulse-dot me-1" aria-hidden="true"></span>
                <span id="accent-text" class="accent-text">Accent text</span> and
                <a id="accent-link" href="#accent">a link</a>, in the theme's shades.
            </p>
            <div class="progress mb-3" role="progressbar" aria-label="Sample progress" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
                <div id="accent-progress" class="progress-bar" style="width: 60%">60%</div>
            </div>
            <button id="sample-primary" type="button" class="btn btn-primary">Primary Action</button>
        </div>
    </div>

    <!-- Bootstrap's controls, in the kit's accent and focus rings. -->
    <div id="controls-view" class="demo-view">
        <h2 class="h6 mb-3">Controls</h2>
        <div class="demo-controls">
            <div class="form-check">
                <input id="sample-check" class="form-check-input" type="checkbox" checked>
                <label class="form-check-label" for="sample-check">A checked box</label>
            </div>
            <div class="form-check form-switch">
                <input id="sample-switch" class="form-check-input" type="checkbox" role="switch">
                <label class="form-check-label" for="sample-switch">A switch, off</label>
            </div>
            <div>
                <label class="form-label" for="sample-select">A select</label>
                <select id="sample-select" class="form-select form-select-sm">
                    <option>First option</option>
                    <option>Second option</option>
                </select>
            </div>
            <div>
                <label class="form-label" for="sample-input">A text field</label>
                <input id="sample-input" class="form-control form-control-sm" type="text">
            </div>
        </div>
    </div>

    <script src="../node_modules/@diamonddigitaldev/electron-kit/page/kit.js"></script>
    <script src="renderer.js"></script>
</body>
</html>

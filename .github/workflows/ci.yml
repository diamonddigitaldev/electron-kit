name: CI

# While the repository is private, its Actions minutes are limited and Windows
# minutes count double. So every push runs everything on Ubuntu, and Windows
# joins on pull requests, and when the workflow is run by hand.
#
# Run by hand with "Update the visual baselines" ticked, it runs only the
# visual spec, on Windows, and uploads the images it takes (README,
# Development).

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update-visual-baselines:
        description: Update the visual baselines (runs only the visual spec, on Windows, and uploads its images)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  house-rules:
    name: House rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, so every commit is checked.
          fetch-depth: 0
          persist-credentials: false

      # No file and no commit message may name one of the organisation's
      # private repositories. Naming them here would do just that, so the list
      # is the PRIVATE_REPO_NAMES secret, one name per line, and this step never
      # prints a name: only the files and commits it was found in. -w, so that
      # "Electron-based" doesn't count as a name that it contains.
      - name: No private repository names in files or commits
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PRIVATE_REPO_NAMES: ${{ secrets.PRIVATE_REPO_NAMES }}
        run: |
          if [ -z "$PRIVATE_REPO_NAMES" ]; then
            echo "::error::The PRIVATE_REPO_NAMES secret isn't set, so there's nothing to check against."
            exit 1
          fi
          # Listed first, so the step fails if git can't list them.
          commits=$(git rev-list HEAD)
          bad=0
          n=0
          while IFS= read -r name; do
            name="${name%$'\r'}"
            [ -n "$name" ] || continue
            n=$((n + 1))
            # git grep exits 1 when nothing matches, and more than 1 when it fails.
            if files=$(git grep -liwF -e "$name" -- .); then
              echo "::error::Private repository name $n is named in:"
              printf '%s\n' "$files" | sed 's/^/  /'
              bad=1
            elif [ $? -ne 1 ]; then
              echo "::error::git grep failed, so the files weren't checked."
              exit 2
            fi
            for commit in $commits; do
              if git log -1 --format='%s%n%b' "$commit" | grep -iwF -e "$name" > /dev/null; then
                echo "::error::Private repository name $n is named in the message of $(git log -1 --format='%h' "$commit")."
                bad=1
              fi
            done
          done <<< "$PRIVATE_REPO_NAMES"
          [ "$bad" = 0 ] && echo "None of the $n private repository names is named in any file or commit message."
          exit "$bad"

  unit:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # npm 12, as on the development machine: it only runs the install scripts package.json allows.
      - name: Install npm 12
        run: npm install -g npm@12

      # Electron downloads its binary the first time it's asked for, not on
      # install, and these tests never ask, so nothing large is downloaded.
      - name: Install dependencies
        run: |
          npm --version
          npm ci

      - name: Run tests
        run: npm test

  electron:
    name: Electron tests and packaged demo (${{ matrix.os }})
    if: ${{ !inputs.update-visual-baselines }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      # npm 12, as on the development machine: it only runs the install scripts package.json allows.
      - name: Install npm 12
        run: npm install -g npm@12

      # Windows runners install global packages outside Node's own folder, and
      # setup-node puts Node's folder, with its bundled npm, first on PATH.
      - name: Put npm 12 first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      # The demo installs the kit from this checkout as a packed copy
      # (demo/.npmrc). Electron downloads its binary the first time it's asked
      # where it is, so that's done here.
      - name: Install dependencies and Electron
        run: |
          npm --version
          npm ci
          npm ci --prefix demo
          cd demo && node -e "console.log(require('electron'))"

      # The libraries Electron needs, and Xvfb, the virtual display its windows
      # open on. Playwright runs apt-get with sudo itself.
      - name: Install Electron's system libraries and Xvfb
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      # The unit job runs them on Ubuntu. On Windows they run here, since the
      # updater's tests drive electron-updater's Windows updater, as File
      # Converter's installed app does.
      - name: Run the unit and contract tests
        if: runner.os == 'Windows'
        run: npm test

      - name: Run the Electron tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx playwright test

      - name: Run the Electron tests
        if: runner.os == 'Windows'
        run: npx playwright test

      # Nothing is published, and no token is passed to it.
      - name: Build the demo
        working-directory: demo
        run: npx --no-install electron-builder ${{ runner.os == 'Windows' && '--win' || '--linux' }} --publish never

      - name: Check the packaged demo carries the kit
        working-directory: demo
        shell: bash
        run: |
          ls -l dist
          ls dist/*.${{ runner.os == 'Windows' && 'exe' || 'AppImage' }} > /dev/null
          list=$(npx --no-install asar list dist/*-unpacked/resources/app.asar | sed 's#\\#/#g')
          for file in package.json main/index.js main/accelerators.js main/channels.js main/info.js main/ipc.js main/menu.js main/shell.js main/store.js main/theme.js main/updater.js main/version.js preload.js css/kit.css page/theme.js page/kit.js; do
            if ! printf '%s\n' "$list" | grep -x "/node_modules/@diamonddigitaldev/electron-kit/$file" > /dev/null; then
              echo "::error::app.asar doesn't carry the kit's $file."
              exit 1
            fi
          done
          echo "app.asar carries the kit's files."

      # The same tests, against the packaged app: on Windows the unpacked app
      # the installer carries, on Linux the AppImage itself, which runs without
      # FUSE by extracting itself first.
      - name: Run the Electron tests against the packaged demo
        if: runner.os == 'Linux'
        run: |
          export KIT_DEMO_EXECUTABLE=$(ls demo/dist/*.AppImage)
          chmod +x "$KIT_DEMO_EXECUTABLE"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx playwright test

      - name: Run the Electron tests against the packaged demo
        if: runner.os == 'Windows'
        env:
          KIT_DEMO_EXECUTABLE: demo/dist/win-unpacked/electron-kit Demo.exe
        run: npx playwright test

      # The only thing this job uploads: when a visual test fails, the image it
      # expected, the one it took and the difference, so the failure can be
      # seen. A workflow artifact is as private as the repository, and it's
      # kept 3 days. Nothing else is uploaded.
      - name: Upload the visual differences
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: visual-differences-${{ github.run_attempt }}
          path: |
            test-results/**/*-actual.png
            test-results/**/*-expected.png
            test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 3

  # Run by hand (update-visual-baselines): the visual spec takes its images
  # afresh on a Windows runner, and they're uploaded as a workflow artifact,
  # as private as the repository and kept 3 days, to be checked and committed
  # (README, Development). Nothing is committed from here.
  visual-baselines:
    name: Visual baselines (windows-latest)
    if: ${{ inputs.update-visual-baselines }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - name: Install npm 12
        run: npm install -g npm@12

      - name: Put npm 12 first on PATH
        shell: pwsh
        run: npm prefix -g >> $env:GITHUB_PATH

      - name: Install dependencies and Electron
        run: |
          npm --version
          npm ci
          npm ci --prefix demo
          cd demo && node -e "console.log(require('electron'))"

      - name: Take the visual baselines
        run: npx playwright test e2e/visual.spec.js --update-snapshots=all

      - name: Upload the visual baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/visual.spec.js-snapshots/
          if-no-files-found: error
          retention-days: 3
